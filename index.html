<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF5D5D">
<meta name="description" content="Practica las tablas de multiplicar y el vocabulario de francés: aciertos de memoria, contrarreloj, fallos para repasar y torneo con amigas.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tablas">
<title>Tablas de Multiplicar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF7EC;
    --bg-card:#FFFFFF;
    --bg-sunken:#FFF0DC;
    --text:#241E33;
    --text-soft:#7A7290;
    --accent:#FF5D5D;
    --accent-ink:#FFFFFF;
    --accent-soft:#FFE3DE;
    --success:#1FB6A4;
    --success-soft:#DAF7F1;
    --warn:#FFC845;
    --warn-soft:#FFF2CE;
    --warn-ink:#8A6300;
    --wrong:#D64550;
    --wrong-soft:#FCE1E1;
    --border:rgba(36,30,51,0.10);
    --shadow:rgba(36,30,51,0.14);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181026;
      --bg-card:#241A38;
      --bg-sunken:#2C2044;
      --text:#F5F1FF;
      --text-soft:#B7ACD6;
      --accent:#FF7B68;
      --accent-ink:#1A0F0F;
      --accent-soft:#3A2230;
      --success:#3FD9C4;
      --success-soft:#123832;
      --warn:#FFD166;
      --warn-soft:#3A2E10;
      --warn-ink:#FFD166;
      --wrong:#FF7A85;
      --wrong-soft:#3A1620;
      --border:rgba(255,255,255,0.10);
      --shadow:rgba(0,0,0,0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#181026;
    --bg-card:#241A38;
    --bg-sunken:#2C2044;
    --text:#F5F1FF;
    --text-soft:#B7ACD6;
    --accent:#FF7B68;
    --accent-ink:#1A0F0F;
    --accent-soft:#3A2230;
    --success:#3FD9C4;
    --success-soft:#123832;
    --warn:#FFD166;
    --warn-soft:#3A2E10;
    --warn-ink:#FFD166;
    --wrong:#FF7A85;
    --wrong-soft:#3A1620;
    --border:rgba(255,255,255,0.10);
    --shadow:rgba(0,0,0,0.45);
    color-scheme: dark;
  }

  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  h1,h2,.num{font-family:'Baloo 2','Nunito',system-ui,sans-serif;}
  button{font-family:inherit;}

  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100%;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  #subjectView{
    display:flex;
    flex-direction:column;
    gap:14px;
    flex:1;
    min-height:0;
  }
  [hidden]{display:none !important;}

  /* ---------- menú principal de asignaturas ---------- */
  .subject-menu{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .subject-card{
    display:flex;
    align-items:center;
    gap:14px;
    text-align:left;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    cursor:pointer;
    box-shadow:0 8px 24px -16px var(--shadow);
    color:var(--text);
    width:100%;
  }
  .subject-card:active{transform:scale(.98);}
  .subject-card .sc-icon{font-size:32px;flex:0 0 auto;line-height:1;}
  .subject-card .sc-text{display:flex;flex-direction:column;gap:2px;}
  .subject-card .sc-title{font-weight:800;font-size:16px;}
  .subject-card .sc-sub{font-weight:600;font-size:12px;color:var(--text-soft);}

  .subject-bar{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .subject-bar-title{
    font-weight:800;
    font-size:14px;
    color:var(--text-soft);
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding-top: env(safe-area-inset-top,0px);
  }
  .brand{display:flex;align-items:center;gap:8px;min-width:0;}
  .mascot{
    width:36px;height:36px;flex:0 0 auto;
  }
  .brand h1{
    font-size:16px;
    font-weight:800;
    margin:0;
    line-height:1.15;
  }
  .stats{display:flex;gap:6px;flex:0 0 auto;}
  .stat{
    display:flex;align-items:center;gap:4px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 9px;
    font-weight:800;
    font-size:13px;
    box-shadow:0 1px 0 var(--shadow);
    white-space:nowrap;
  }
  .stat b{font-variant-numeric:tabular-nums;}

  /* ---------- mode tabs ---------- */
  .modes{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .mode-btn{
    border:1px solid var(--border);
    background:var(--bg-card);
    color:var(--text-soft);
    font-weight:800;
    font-size:13px;
    padding:10px 6px;
    border-radius:14px;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease, color .15s ease;
  }
  .mode-btn:active{transform:scale(.96);}
  .mode-btn.active{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:transparent;
  }
  .modes-3{grid-template-columns:repeat(3,1fr);}

  /* ---------- table chips ---------- */
  .tables-picker{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .tables-picker::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:var(--bg-card);
    color:var(--text);
    font-weight:800;
    font-size:14px;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .chip.active{
    background:var(--text);
    color:var(--bg-card);
    border-color:transparent;
  }

  /* ---------- game card ---------- */
  .game-card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:22px;
    box-shadow:0 8px 24px -12px var(--shadow);
    padding:22px 18px;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:18px;
    min-height:300px;
    position:relative;
    overflow-y:auto;
    overflow-x:hidden;
  }
  .timerbar{
    position:absolute; top:0; left:0; right:0; height:5px;
    background:var(--bg-sunken);
  }
  .timerbar i{
    display:block;height:100%;width:100%;
    background:var(--warn);
    transform-origin:left;
    transition:width 1s linear, background .3s ease;
  }
  .question-wrap{text-align:center;}
  .question-sub{
    color:var(--text-soft);
    font-weight:700;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.06em;
    margin:0 0 6px;
  }
  .question .num{
    font-size:46px;
    font-weight:800;
    line-height:1;
  }
  .question .op{color:var(--accent);margin:0 6px;}

  .answer-display{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    min-width:88px;
    margin:0 auto;
    background:var(--bg-sunken);
    border:2px solid transparent;
    border-radius:16px;
    padding:10px 18px;
    font-size:32px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    color:var(--text);
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .answer-display .ph{color:var(--text-soft);}
  .answer-display .cursor{
    color:var(--accent);
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{opacity:0;} }
  .answer-display.correct{background:var(--success-soft);border-color:var(--success);color:var(--success);}
  .answer-display.wrong{background:var(--wrong-soft);border-color:var(--wrong);color:var(--wrong);}

  /* ---------- vocabulario de francés ---------- */
  .fr-prompt{
    font-family:'Baloo 2','Nunito',system-ui,sans-serif;
    font-size:28px;
    font-weight:800;
    line-height:1.25;
    padding:0 6px;
  }
  .fr-meaning{
    font-size:18px;
    font-weight:700;
    color:var(--text-soft);
    margin-top:10px;
  }
  .aprender-count{
    font-size:13px;
    font-weight:700;
    color:var(--text-soft);
    margin-top:14px;
  }
  .frances-input{
    display:block;
    width:100%;
    max-width:300px;
    margin:0 auto;
    text-align:center;
    background:var(--bg-sunken);
    border:2px solid transparent;
    border-radius:16px;
    padding:14px 16px;
    font-family:inherit;
    font-size:19px;
    font-weight:800;
    color:var(--text);
  }
  .frances-input:focus{border-color:var(--accent);outline:none;}
  .frances-input.correct{background:var(--success-soft);border-color:var(--success);color:var(--success);}
  .frances-input.wrong{background:var(--wrong-soft);border-color:var(--wrong);color:var(--wrong);}
  .accent-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    max-width:300px;
    margin:0 auto;
  }
  .accent-btn{
    background:var(--bg-sunken);
    border:1px solid var(--border);
    border-radius:10px;
    padding:6px 11px;
    font-size:16px;
    font-weight:800;
    color:var(--text);
    cursor:pointer;
  }
  .accent-btn:active{transform:scale(.92);}
  .accent-btn[disabled]{opacity:.5;cursor:default;transform:none;}

  .speaker-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:var(--bg-sunken);
    border:1px solid var(--border);
    border-radius:999px;
    cursor:pointer;
    color:var(--text);
  }
  .speaker-btn:active{transform:scale(.92);}
  .speaker-btn.small{width:32px;height:32px;font-size:15px;margin:8px auto 0;}
  .speaker-btn.big{width:88px;height:88px;font-size:38px;margin:4px auto 0;box-shadow:0 8px 20px -10px var(--shadow);}

  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    max-width:280px;
    margin:0 auto;
    width:100%;
  }
  .keypad-btn{
    background:var(--bg-sunken);
    border:none;
    border-radius:14px;
    padding:14px 0;
    font-size:22px;
    font-weight:800;
    color:var(--text);
    cursor:pointer;
    font-variant-numeric:tabular-nums;
    transition:transform .1s ease, background .15s ease;
  }
  .keypad-btn:active{transform:scale(.94);}
  .keypad-btn.ok{background:var(--success);color:#fff;}
  .keypad-btn.del{background:var(--bg-card);border:1px solid var(--border);color:var(--text-soft);font-size:18px;}
  .keypad-btn[disabled]{opacity:.5;cursor:default;transform:none;}

  .feedback{
    text-align:center;
    font-weight:800;
    font-size:15px;
    min-height:20px;
    color:var(--text-soft);
  }
  .feedback.good{color:var(--success);}
  .feedback.bad{color:var(--wrong);}

  .result-mark{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:5;
  }
  .result-mark svg{
    width:150px;
    height:150px;
    filter:drop-shadow(0 10px 22px var(--shadow));
    animation:resultPop .38s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes resultPop{
    0%{ transform:scale(.35); opacity:0; }
    65%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .result-mark svg{ animation:none; }
  }

  .empty-state{
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
  }
  .empty-state .num{font-size:40px;}
  .empty-state p{color:var(--text-soft);font-weight:700;margin:0;max-width:34ch;}

  .summary{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .summary .num{font-size:44px;font-weight:800;}
  .summary p{margin:0;color:var(--text-soft);font-weight:700;}
  .primary-btn{
    margin-top:6px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:14px;
    padding:12px 22px;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
  }
  .primary-btn:active{transform:scale(.97);}
  .ghost-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-soft);
    border-radius:14px;
    padding:10px 18px;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
  }

  .name-input{
    width:100%;
    max-width:240px;
    text-align:center;
    background:var(--bg-sunken);
    border:2px solid transparent;
    border-radius:14px;
    padding:12px 14px;
    font-family:inherit;
    font-size:17px;
    font-weight:800;
    color:var(--text);
  }
  .name-input:focus{border-color:var(--accent);outline:none;}
  .name-input::placeholder{color:var(--text-soft);font-weight:700;}

  .leaderboard{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:4px;
  }
  .leader-row{
    display:grid;
    grid-template-columns:28px 1fr auto;
    align-items:center;
    gap:8px;
    background:var(--bg-sunken);
    border-radius:12px;
    padding:8px 12px;
    font-weight:800;
  }
  .leader-rank{font-size:14px;color:var(--text-soft);text-align:center;}
  .leader-name{
    text-align:left;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .leader-score{font-variant-numeric:tabular-nums;color:var(--accent);}

  /* ---------- torneo: elegir modo y compartir resultado ---------- */
  .torneo-choice{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
  }
  .torneo-choice-btn{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    background:var(--bg-sunken);
    border:2px solid transparent;
    border-radius:16px;
    padding:14px 16px;
    cursor:pointer;
    color:var(--text);
    width:100%;
  }
  .torneo-choice-btn:active{transform:scale(.98);}
  .torneo-choice-btn .tc-icon{font-size:28px;flex:0 0 auto;line-height:1;}
  .torneo-choice-btn .tc-text{display:flex;flex-direction:column;gap:2px;}
  .torneo-choice-btn .tc-title{font-weight:800;font-size:15px;}
  .torneo-choice-btn .tc-sub{font-weight:600;font-size:12px;color:var(--text-soft);}
  .back-choice-btn{
    font-size:12px;
    padding:6px 14px;
  }
  .share-actions{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .share-preview{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    margin-top:6px;
  }
  .share-preview img{
    width:100%;
    max-width:220px;
    border-radius:16px;
    box-shadow:0 8px 24px -12px var(--shadow);
  }

  /* ---------- mastery strip ---------- */
  .mastery{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:5px;
  }
  .mastery-pill{
    border:none;
    border-radius:10px;
    padding:7px 0;
    font-weight:800;
    font-size:11px;
    color:var(--text-soft);
    background:var(--bg-sunken);
    cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .mastery-pill.m-low{background:var(--wrong-soft);color:var(--wrong);}
  .mastery-pill.m-mid{background:var(--warn-soft);color:var(--warn-ink);}
  .mastery-pill.m-high{background:var(--success-soft);color:var(--success);}
  .mastery-pill.picked{outline:2px solid var(--accent);outline-offset:1px;}
  .mastery-3{grid-template-columns:repeat(3,1fr);}

  .hint{
    text-align:center;
    color:var(--text-soft);
    font-size:12px;
    font-weight:700;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>


<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="mascot" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="34" r="26" fill="var(--accent-soft)"/>
        <circle cx="32" cy="34" r="20" fill="var(--accent)"/>
        <circle cx="24" cy="30" r="4.2" fill="#fff"/>
        <circle cx="40" cy="30" r="4.2" fill="#fff"/>
        <circle cx="24" cy="31" r="2.1" fill="#241E33"/>
        <circle cx="40" cy="31" r="2.1" fill="#241E33"/>
        <path d="M23 42q9 7 18 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M14 20l4 6M50 20l-4 6" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <h1>Tablas de Multiplicar</h1>
    </div>
    <div class="stats">
      <span class="stat streak">🔥<b id="streakVal">0</b></span>
      <span class="stat stars">⭐<b id="starsVal">0</b></span>
    </div>
  </header>

  <section class="subject-menu" id="subjectMenu" aria-label="Elegir asignatura"></section>

  <div id="subjectView" hidden>
    <div class="subject-bar">
      <button class="ghost-btn back-choice-btn" id="backToMenuBtn">‹ Menú</button>
      <span class="subject-bar-title" id="subjectBarTitle"></span>
    </div>

    <nav class="modes" role="tablist" id="modes">
      <button class="mode-btn active" data-mode="practica" role="tab" aria-selected="true">Práctica</button>
      <button class="mode-btn" data-mode="contrarreloj" role="tab" aria-selected="false">Contrarreloj</button>
      <button class="mode-btn" data-mode="repaso" role="tab" aria-selected="false">Fallos</button>
      <button class="mode-btn" data-mode="torneo" role="tab" aria-selected="false">Torneo</button>
    </nav>

    <section class="tables-picker" id="tablesPicker" aria-label="Elegir tablas"></section>
    <section class="tables-picker" id="categoryPicker" aria-label="Elegir categoría" hidden></section>

    <main class="game-card" id="gameCard">
      <div class="timerbar" id="timerBar" hidden><i id="timerFill"></i></div>
    </main>

    <footer class="mastery" id="masteryStrip" aria-label="Progreso por tabla"></footer>
    <p class="hint" id="hintText"></p>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     Progreso persistente (localStorage). Si falla, seguimos
     igual, solo que sin memoria entre sesiones.
     ========================================================= */
  var STORE_KEY      = "tablas-progreso-v1";
  var FAILS_KEY      = "tablas-fallos-v1";
  var BEST_KEY       = "tablas-mejor-contrarreloj-v1";
  var TORNEO_KEY     = "tablas-torneo-v1";
  var SHARE_BEST_KEY = "tablas-torneo-compartir-mejor-v1";
  var FALLOS_FR_KEY  = "tablas-fallos-frances-v1";
  var BEST_FR_KEY    = "tablas-mejor-contrarreloj-frances-v1";
  var PROGRESO_FR_KEY = "tablas-progreso-frances-v1";

  function loadJSON(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ /* sin memoria, no pasa nada */ }
  }

  var progreso = loadJSON(STORE_KEY, {}); // { "3": {correct:5, total:8}, ... }
  var fallos   = loadJSON(FAILS_KEY, []); // [{a:3,b:7}, ...]
  var mejorContrarreloj = loadJSON(BEST_KEY, 0);
  var torneo = loadJSON(TORNEO_KEY, {}); // { "nombre en minúsculas": {name, best, games} } — clasificación local, se juega pasando el móvil
  var mejorTorneoCompartir = loadJSON(SHARE_BEST_KEY, 0); // mejor marca de este móvil en el modo "cada una con el suyo"
  // [{fr:"le poisson", count:2, lastWrong:169...}, ...] — palabras falladas,
  // con cuántas veces se han fallado para repasar más las que más cuestan.
  // Si venía del formato antiguo (solo strings), se adapta sola al cargar.
  var fallosFrances = loadJSON(FALLOS_FR_KEY, []).map(function(f){
    return (typeof f === "string") ? {fr:f, count:1, lastWrong:Date.now()} : f;
  });

  /* ---------------- Tira de progreso por tabla ---------------- */
  function renderMasteryStrip(){
    var html = "";
    for(var i=1;i<=10;i++){
      var d = progreso[i] || {correct:0,total:0};
      var pct = d.total ? Math.round((d.correct/d.total)*100) : 0;
      var cls = "m-low";
      if(pct >= 80) cls = "m-high"; else if(pct >= 40) cls = "m-mid";
      var picked = (state.selectedTables.length===1 && state.selectedTables[0]===i) ? " picked" : "";
      html += '<button class="mastery-pill '+cls+picked+'" data-table="'+i+'" title="Tabla del '+i+': '+pct+'%">×'+i+'<br>'+pct+'%</button>';
    }
    els.masteryStrip.innerHTML = html;
  }
  els.masteryStrip.addEventListener("click", function(e){
    var btn = e.target.closest(".mastery-pill");
    if(!btn) return;
    if(state.subject === "frances"){
      var cat = btn.getAttribute("data-cat");
      if(!cat) return;
      if(state.francesCategories.length === 1 && state.francesCategories[0] === cat){
        state.francesCategories = FR_CATS.map(function(c){ return c.id; }); // toca otra vez para volver a "todas"

        state.francesCategories = [cat];

      renderFrancesMasteryStrip();
      if(state.mode === "practica" || state.mode === "dictado") next();
      else if(state.mode === "aprender") startAprender();
      return;
    }
    var t = btn.getAttribute("data-table");

    state.selectedTables = [parseInt(t,10)];
    syncTablesPickerUI();
    renderMasteryStrip();
    if(state.mode === "practica") next();

  /* ---------------- Tira de progreso por categoría (francés) ---------------- */
  function renderFrancesMasteryStrip(){
    var html = FR_CATS.map(function(c){
      var correct = 0, total = 0;
      FRANCES_DATA.forEach(function(w){
        if(w.cat !== c.id) return;
        var d = progresoFrances[w.fr];
        if(d){ correct += d.correct; total += d.total; }
      });
      var pct = total ? Math.round((correct/total)*100) : 0;
      var cls = "m-low";
      if(pct >= 80) cls = "m-high"; else if(pct >= 40) cls = "m-mid";
      var picked = (state.francesCategories.length===1 && state.francesCategories[0]===c.id) ? " picked" : "";
      return '<button class="mastery-pill '+cls+picked+'" data-cat="'+c.id+'" title="'+escapeHTML(c.label)+': '+pct+'%">'+escapeHTML(c.label)+'<br>'+pct+'%</button>';
    }).join('');

  }

      if(idx === -1) state.francesCategories.push(cat);
      else if(state.francesCategories.length > 1) state.francesCategories.splice(idx,1);

      if(state.subject === "frances") renderFrancesContrarrelojIntro();

  function updateHint(){
    if(state.subject === "frances"){
      if(state.mode === "aprender") els.hint.textContent = "Sin preguntas todavía: lee cada palabra, escúchala y pasa a la siguiente cuando ya te la sepas.";
      else if(state.mode === "practica") els.hint.textContent = "A veces te pide el significado, a veces escribirla en francés y a veces solo el artículo correcto. Todo de memoria.";
      else if(state.mode === "dictado") els.hint.textContent = "Escucha la palabra y escríbela con su artículo, tal y como la oigas.";
      else if(state.mode === "contrarreloj") els.hint.textContent = "60 segundos de vocabulario. ¡A por tu récord: " + mejorContrarrelojFrances + "!";
      else if(state.mode === "examen") els.hint.textContent = "Examen de " + EXAM_LENGTH + " preguntas sin pistas, para practicar como si fuera de verdad.";
      else els.hint.textContent = "Aquí aparecen las palabras de francés que fallaste, para repasarlas (las que más fallas salen más).";
      return;
    }
    if(state.mode === "practica") els.hint.textContent = "Escribe el resultado de memoria y pulsa ✓. Puedes elegir una sola tabla arriba.";
    else if(state.mode === "contrarreloj") els.hint.textContent = "60 segundos, las que aciertes suman. ¡A por tu récord: " + mejorContrarreloj + "!";
    else if(state.mode === "torneo"){
      if(state.torneoSubmode === "compartir") els.hint.textContent = "Juega tu ronda y comparte la imagen con el resultado por chat.";
      else if(state.torneoSubmode === "movil") els.hint.textContent = "Pasaos el móvil entre amigas: cada ronda son 45 segundos y suma para la clasificación.";
      else els.hint.textContent = "Elige cómo queréis jugar: pasando el móvil o cada una con el suyo.";
    }
    else els.hint.textContent = "Aquí aparecen las multiplicaciones que fallaste, para repasarlas.";

  /* ---------------- Práctica ---------------- */
  function next(){
    if(state.subject === "frances"){
      if(state.mode === "repaso"){
        nextFrancesRepaso();
        return;
      }
      if(state.mode === "dictado"){
        state.current = generateDictadoPregunta();
        renderFrancesQuestion();
        return;
      }
      state.current = generateFrancesPregunta();
      renderFrancesQuestion();
      return;
    }
    if(state.mode === "repaso"){
      nextRepaso();
      return;
    }
    state.current = generatePregunta(state.selectedTables);
    renderQuestion();
  }

  var KEYPAD_KEYS = ["1","2","3","4","5","6","7","8","9","del","0","ok"];

  function renderQuestion(){
    var q = state.current;
    state.currentInput = "";
    state.answered = false;
    var timed = (state.mode === "contrarreloj" || state.mode === "torneo");
    var html = '';
    if(timed) html += '<div class="timerbar" id="timerBar"><i id="timerFill"></i></div>';
    html += '<div class="question-wrap">'
      + '<p class="question-sub">'+ (state.mode==="repaso" ? "Repasando un fallo" : (state.mode==="torneo" ? escapeHTML(state.playerName) : "¿Cuánto es...?")) +'</p>'
      + '<div class="question"><span class="num">'+q.a+'</span><span class="op">×</span><span class="num">'+q.b+'</span></div>'
      + '</div>'
      + '<div class="answer-display" id="answerDisplay"><span class="ph">?</span></div>'
      + '<div class="keypad" id="keypad">'
      + KEYPAD_KEYS.map(function(k){
          if(k === "del") return '<button class="keypad-btn del" data-k="del" aria-label="Borrar">⌫</button>';
          if(k === "ok") return '<button class="keypad-btn ok" data-k="ok" aria-label="Comprobar">✓</button>';
          return '<button class="keypad-btn" data-k="'+k+'">'+k+'</button>';
        }).join('')
      + '</div>'
      + '<p class="feedback" id="feedback"></p>';
    els.gameCard.innerHTML = html;
    if(timed){
      els.timerBar = document.getElementById("timerBar");
      els.timerFill = document.getElementById("timerFill");
    }
    document.getElementById("keypad").addEventListener("click", function(e){
      var btn = e.target.closest(".keypad-btn");
      if(!btn || state.answered) return;
      handleKey(btn.getAttribute("data-k"));
    });
  }

  function updateAnswerDisplay(){
    var el = document.getElementById("answerDisplay");
    if(!el) return;
    if(state.currentInput === ""){
      el.innerHTML = '<span class="ph">?</span>';
    }else{
      el.innerHTML = state.currentInput.split("").map(function(d){ return '<span>'+d+'</span>'; }).join('') + '<span class="cursor">|</span>';
    }
  }

  function handleKey(k){
    if(state.answered) return;
    if(k === "del"){
      state.currentInput = state.currentInput.slice(0,-1);
      updateAnswerDisplay();
    }else if(k === "ok"){
      checkAnswer();
    }else if(state.currentInput.length < 3){
      state.currentInput += k;
      updateAnswerDisplay();
    }
  }

  document.addEventListener("keydown", function(e){
    if(state.subject === "frances") return; // el modo francés tiene su propio input de texto
    if(!state.current || state.answered) return;
    if(e.key >= "0" && e.key <= "9"){ handleKey(e.key); }
    else if(e.key === "Backspace"){ handleKey("del"); }
    else if(e.key === "Enter"){ handleKey("ok"); }
  });

  // Marca grande de acierto/fallo: un badge en forma de ✓ o ✗ que aparece
  // encima de la tarjeta al comprobar la respuesta (se borra solo con la
  // siguiente pregunta, porque esa repinta toda la tarjeta).
  function markSVG(ok){
    var color = ok ? "var(--success)" : "var(--wrong)";
    var path = ok
      ? '<path d="M27 53 L43 69 L75 31" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'
      : '<path d="M31 31 L69 69 M69 31 L31 69" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none"/>';
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="'+color+'"/>'+path+'</svg>';
  }
  function showResultMark(ok){
    var old = els.gameCard.querySelector(".result-mark");
    if(old) old.remove();
    var mark = document.createElement("div");
    mark.className = "result-mark";
    mark.innerHTML = markSVG(ok);
    els.gameCard.appendChild(mark);
  }

  function checkAnswer(){
    if(state.answered || state.currentInput === "") return;
    state.answered = true;
    var q = state.current;
    var value = parseInt(state.currentInput, 10);
    var ok = value === q.correct;

    var displayEl = document.getElementById("answerDisplay");
    if(displayEl) displayEl.classList.add(ok ? "correct" : "wrong");
    Array.prototype.forEach.call(document.querySelectorAll(".keypad-btn"), function(b){ b.disabled = true; });
    showResultMark(ok);

    var stats = regTable(q.a);
    stats.total++;

    var fb = document.getElementById("feedback");
    if(ok){
      stats.correct++;
      state.streak++;
      if(state.streak > 0 && state.streak % 5 === 0) state.stars++;
      if(state.roundActive) state.roundScore++;
      fb.textContent = pick(["¡Genial!","¡Eso es!","¡Muy bien!","¡Perfecto!","¡Sigue así!"]);
      fb.className = "feedback good";
      removeFromFallos(q.a, q.b);
    }else{
      state.streak = 0;
      fb.textContent = "Era "+q.a+" × "+q.b+" = "+q.correct+". ¡A por la siguiente!";
      fb.className = "feedback bad";
      addToFallos(q.a, q.b);
    }
    saveJSON(STORE_KEY, progreso);
    els.streakVal.textContent = state.streak;
    els.starsVal.textContent = state.stars;
    renderMasteryStrip();

    var delay = ok ? 700 : 1800;
    setTimeout(function(){
      if(state.roundActive || (state.mode !== "contrarreloj" && state.mode !== "torneo")){
        next();
      }
    }, delay);
  }

  /* ---------------- Fallos guardados ---------------- */
  function sameFallo(f,a,b){ return f.a===a && f.b===b; }
  function addToFallos(a,b){
    if(!fallos.some(function(f){return sameFallo(f,a,b);})){
      fallos.push({a:a,b:b});
      saveJSON(FAILS_KEY, fallos);
    }
  }
  function removeFromFallos(a,b){
    var next = fallos.filter(function(f){ return !sameFallo(f,a,b); });
    if(next.length !== fallos.length){
      fallos = next;
      saveJSON(FAILS_KEY, fallos);
    }
  }
  function nextRepaso(){
    if(fallos.length === 0){
      els.gameCard.innerHTML = '<div class="empty-state">'
        + '<span class="num">🎉</span>'
        + '<p>¡No hay fallos pendientes! Practica más multiplicaciones y las que se te resistan aparecerán aquí para repasarlas.</p>'
        + '<button class="primary-btn" id="goPractica">Ir a práctica</button>'
        + '</div>';
      document.getElementById("goPractica").addEventListener("click", function(){ setMode("practica"); });
      return;
    }
    var f = pick(fallos);
    state.current = { a:f.a, b:f.b, correct:f.a*f.b };
    renderQuestion();
  }

  /* ---------------- Motor de ronda a contrarreloj ----------------
     Lo comparten "Contrarreloj" (una sola jugadora, récord personal)
     y "Torneo" (varias jugadoras se pasan el móvil, clasificación).
     state.roundDuration marca la duración y state.mode decide qué
     pantalla de resumen se pinta al terminar (ver endRound). */
  function renderContrarrelojIntro(){
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">⏱️</span>'
      + '<p>60 segundos. Responde tantas como puedas.<br>Tu récord: <b>'+mejorContrarreloj+'</b></p>'
      + '<button class="primary-btn" id="startRoundBtn">Empezar</button>'
      + '</div>';
    document.getElementById("startRoundBtn").addEventListener("click", function(){ startRound(60); });
  }
  function startRound(duration){
    state.roundActive = true;
    state.roundScore = 0;
    state.roundDuration = duration;
    state.timeLeft = duration;
    next();
    tickTimer();
    state.timerId = setInterval(tickTimer, 1000);
  }
  function tickTimer(){
    if(!state.roundActive) return;
    state.timeLeft--;
    if(els.timerFill){
      var pct = Math.max(0, (state.timeLeft/state.roundDuration)*100);
      els.timerFill.style.width = pct + "%";
      els.timerFill.style.background = pct < 25 ? "var(--wrong)" : "var(--warn)";
    }
    if(state.timeLeft <= 0){
      endRound();
    }
  }
  function stopTimer(){
    if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
  }
  function endRound(){
    stopTimer();
    state.roundActive = false;
    if(state.subject === "frances"){
      endFrancesContrarrelojRound();
      return;
    }
    if(state.mode === "torneo"){
      if(state.torneoSubmode === "compartir") endTorneoShareRound();
      else endTorneoRound();
    }else{
      endContrarrelojRound();
    }
  }
  function endContrarrelojRound(){
    if(state.roundScore > mejorContrarreloj){
      mejorContrarreloj = state.roundScore;
      saveJSON(BEST_KEY, mejorContrarreloj);
    }
    var esRecord = state.roundScore === mejorContrarreloj && state.roundScore > 0;
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">'+state.roundScore+'</span>'
      + '<p>'+(esRecord ? "¡Nuevo récord! 🏆" : "Aciertos en 60 segundos")+'</p>'
      + '<p>Tu mejor marca: '+mejorContrarreloj+'</p>'
      + '<button class="primary-btn" id="retryRoundBtn">Otra vez</button>'
      + '</div>';
    document.getElementById("retryRoundBtn").addEventListener("click", function(){ startRound(60); });
    updateHint();
  }

  /* ---------------- Torneo: dos formas de jugar ----------------
     "movil": os pasáis el mismo móvil entre amigas y competís en
              una clasificación local guardada en este dispositivo.
     "compartir": cada una juega en su propio móvil y, al acabar,
              genera una imagen con el resultado para compartirla
              por WhatsApp, Just Talk Kids, etc. */
  function torneoRanking(){
    return Object.keys(torneo).map(function(k){ return torneo[k]; })
      .sort(function(x,y){ return y.best - x.best; });
  }
  function renderLeaderboardHTML(){
    var ranking = torneoRanking();
    if(ranking.length === 0){
      return '<p class="hint" style="margin:4px 0 0">Todavía no hay nadie en la clasificación. ¡Sé la primera!</p>';
    }
    var medals = ["🥇","🥈","🥉"];
    var rows = ranking.slice(0,10).map(function(p, i){
      var medal = medals[i] || (i+1)+".";
      return '<div class="leader-row">'
        + '<span class="leader-rank">'+medal+'</span>'
        + '<span class="leader-name">'+escapeHTML(p.name)+'</span>'
        + '<span class="leader-score">'+p.best+'</span>'
        + '</div>';
    }).join('');
    return '<div class="leaderboard">'+rows+'</div>';
  }
  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function renderTorneoIntro(){
    if(state.torneoSubmode === "movil") renderTorneoMovilIntro();
    else if(state.torneoSubmode === "compartir") renderTorneoCompartirIntro();
    else renderTorneoModeChoice();
  }

      + '<button class="torneo-choice-btn" id="chooseCompartir"><span class="tc-icon">📤</span><span class="tc-text"><span class="tc-title">Cada una con el suyo</span><span class="tc-sub">Jugáis por separado y compartís el resultado por chat</span></span></button>'
      + '</div>'
      + '</div>';
    document.getElementById("chooseMovil").addEventListener("click", function(){

  function renderTorneoCompartirIntro(){

  function endTorneoRound(){

    if(!entry){

      torneo[key] = entry;
    }
    entry.games++;
    var esRecordPersonal = state.roundScore > entry.best;
    if(esRecordPersonal) entry.best = state.roundScore;
    saveJSON(TORNEO_KEY, torneo);

    var ranking = torneoRanking();

  /* ---------------- Torneo: modo "cada una con el suyo" ----------------
     Al acabar la ronda se genera una imagen (canvas) con el resultado y

     lo que sea que tengan instalado); si el móvil no lo soporta, se
     enseña la imagen en pantalla para guardarla o compartirla a mano. */
  function endTorneoShareRound(){
    var name = state.playerName.trim() || "Jugadora";
    var esRecordPersonal = state.roundScore > mejorTorneoCompartir;
    if(esRecordPersonal){
      mejorTorneoCompartir = state.roundScore;

    }
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">'+state.roundScore+'</span>'

  // Dibuja la misma mascota redonda de la cabecera, a escala, sobre un canvas.
  function drawMascot(ctx, cx, cy, r){
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = "#FFE3DE";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, r*0.77, 0, Math.PI*2);
    ctx.fillStyle = "#FF5D5D";
    ctx.fill();
    var eyeOffsetX = r*0.31, eyeOffsetY = r*-0.12, eyeR = r*0.16;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(cx-eyeOffsetX, cy+eyeOffsetY, eyeR, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+eyeOffsetX, cy+eyeOffsetY, eyeR, 0, Math.PI*2); ctx.fill();
    var pupilR = eyeR*0.5;
    ctx.fillStyle = "#241E33";
    ctx.beginPath(); ctx.arc(cx-eyeOffsetX, cy+eyeOffsetY+r*0.03, pupilR, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+eyeOffsetX, cy+eyeOffsetY+r*0.03, pupilR, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = r*0.09;
    ctx.lineCap = "round";
    ctx.arc(cx, cy+r*0.18, r*0.36, 0.15*Math.PI, 0.85*Math.PI);
    ctx.stroke();
  }

  // Tarjeta-imagen con el resultado, pensada para compartirse en un chat:
  // colores fijos (no depende del tema claro/oscuro del móvil que la reciba).
  function buildResultCardCanvas(name, score, esRecord){
    var W = 900, H = 1200;
    var canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext("2d");

    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, "#FFF7EC");
    grad.addColorStop(1, "#FFE3DE");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = "#FF5D5D";
    ctx.fillRect(0,0,W,240);

    drawMascot(ctx, W/2, 130, 90);

    ctx.textAlign = "center";
    ctx.fillStyle = "#241E33";
    ctx.font = "800 46px 'Baloo 2'";
    ctx.fillText("Tablas de Multiplicar", W/2, 310);

    ctx.font = "700 32px 'Nunito'";
    ctx.fillStyle = "#7A7290";
    ctx.fillText(name, W/2, 360);

    ctx.font = "800 280px 'Baloo 2'";
    ctx.fillStyle = "#FF5D5D";
    ctx.fillText(String(score), W/2, 650);

    ctx.font = "700 36px 'Nunito'";
    ctx.fillStyle = "#241E33";
    ctx.fillText("aciertos en 45 segundos", W/2, 710);

    if(esRecord){
      ctx.font = "800 38px 'Baloo 2'";
      ctx.fillStyle = "#1FB6A4";
      ctx.fillText("🏆 ¡Nuevo récord personal!", W/2, 780);
    }

    ctx.font = "700 28px 'Nunito'";
    ctx.fillStyle = "#7A7290";
    ctx.fillText("¿Te atreves a superarme?", W/2, H-140);
    ctx.font = "700 24px 'Nunito'";
    ctx.fillText("adsepal.github.io/tablas-multiplicar", W/2, H-95);

    return canvas;
  }

  function ensureCardFonts(){
    if(!(document.fonts && document.fonts.load)) return Promise.resolve();
    return Promise.all([
      document.fonts.load("800 40px 'Baloo 2'"),
      document.fonts.load("700 30px 'Nunito'")
    ]).catch(function(){ }).then(function(){
      return document.fonts.ready;
    });
  }

  function buildResultCardBlob(name, score, esRecord){
    return ensureCardFonts().then(function(){
      var canvas = buildResultCardCanvas(name, score, esRecord);
      return new Promise(function(resolve, reject){
        canvas.toBlob(function(blob){
          if(blob) resolve(blob); else reject(new Error("toBlob failed"));
        }, "image/png");
      });
    });
  }

  function offerImageFallback(blob, msgEl){
    var url = URL.createObjectURL(blob);
    var old = els.gameCard.querySelector(".share-preview");
    if(old) old.remove();
    var div = document.createElement("div");
    div.className = "share-preview";
    // Dentro de un Artifact de Claude el enlace de descarga normal no
    // funciona (el visor no da permiso), así que ahí usamos su propia
    // capacidad de descargas; fuera (la web publicada) usamos el enlace
    // de toda la vida. En ambos casos se puede mantener pulsada la
    // imagen para guardarla o compartirla a mano.
    var inClaude = !!(window.claude && window.claude.use);
    div.innerHTML = '<img src="'+url+'" alt="Resultado">'
      + '<p class="hint">Mantén pulsada la imagen para guardarla o compartirla'
      + (inClaude ? ', o <button class="ghost-btn" id="dlBtn" style="margin-top:6px">Guardar imagen</button>' : ', o <a href="'+url+'" download="tablas-resultado.png">descárgala aquí</a>')
      + '.</p>';
    els.gameCard.appendChild(div);
    if(msgEl) msgEl.textContent = "";
    if(inClaude){
      var dlBtn = document.getElementById("dlBtn");
      if(dlBtn){
        dlBtn.addEventListener("click", function(){
          window.claude.use("downloads").then(function(downloads){
            if(!downloads) return;
            return downloads.save({ filename: "tablas-resultado.png", data: blob });
          }).catch(function(){ /* el visor no lo permite: queda la imagen para guardarla a mano */ });
        });
      }
    }
  }

  function shareResultCard(name, score, esRecord){
    var msgEl = document.getElementById("shareMsg");
    if(msgEl){ msgEl.textContent = "Preparando imagen…"; msgEl.className = "feedback"; }
    buildResultCardBlob(name, score, esRecord).then(function(blob){
      var file = null;
      try{ file = new File([blob], "tablas-"+score+".png", {type:"image/png"}); }catch(e){ file = null; }
      var canShareFiles = !!(file && navigator.canShare && navigator.canShare({files:[file]}));
      if(canShareFiles && navigator.share){
        navigator.share({
          files: [file],
          title: "Tablas de Multiplicar",
          text: "¡" + score + " aciertos en 45 segundos! ¿Te atreves a superarme?"
        }).then(function(){
          if(msgEl) msgEl.textContent = "";
        }).catch(function(err){
          if(err && err.name === "AbortError"){ if(msgEl) msgEl.textContent = ""; return; }
          offerImageFallback(blob, msgEl);
        });
      }else{
        offerImageFallback(blob, msgEl);
      }
    }).catch(function(){
      if(msgEl){ msgEl.textContent = "No se pudo generar la imagen."; msgEl.className = "feedback bad"; }
    });
  }

  /* ---------------- Vocabulario de francés ---------------- */
  function stripAccents(s){
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "");
  }
  function normalizeEs(s){
    var t = stripAccents(String(s).toLowerCase()).trim();
    t = t.replace(/[.,!?¡¿]/g, "");
    t = t.replace(/\s+/g, " ");
    t = t.replace(/^(el|la|los|las|un|una|unos|unas)\s+/, "");
    return t;
  }
  function normalizeFr(s){
    var t = String(s).toLowerCase().trim();
    t = t.replace(/[.,!?]/g, "");
    t = t.replace(/-/g, " ");
    t = t.replace(/\s+/g, " ");
    return t;
  }

  // El artículo (le/la/un/une/les) va pegado a la palabra en FRANCES_DATA
  // porque eso es justo lo que tiene que escribir de memoria. La dirección
  // "articulo" le enseña la palabra pelada (sin artículo) y ella tiene que
  // reconstruir "le/la/un/une/les + palabra" — así el género (y el plural
  // de las "les...") se demuestra escribiendo, no adivinando con botones.
  function buildFrancesQuestion(item){
    var dir = pick(["fr2es", "es2fr", "articulo"]);
    if(dir === "articulo"){
      return { dir: "articulo", item: item, prompt: item.fr.replace(/^(le|la|un|une|les)\s+/, "") };
    }
    return { dir: dir, item: item, prompt: dir === "fr2es" ? item.fr : item.es[0] };
  }
  function generateFrancesPregunta(){
    var pool = francesPool();
    if(!pool.length) pool = FRANCES_DATA;
    return buildFrancesQuestion(pick(pool));
  }
  // Dictado: no se ve la palabra escrita, solo se oye (o, si el dispositivo
  // no puede leer en voz alta, se ve como último recurso para que el
  // ejercicio no se quede bloqueado).
  function generateDictadoPregunta(){
    var pool = francesPool();
    if(!pool.length) pool = FRANCES_DATA;
    return { dir: "dictado", item: pick(pool), prompt: "" };
  }
  function speakFrench(text){
    try{
      if(!("speechSynthesis" in window)) return false;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "fr-FR";
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
      return true;
    }catch(e){ return false; }
  }

  function insertAtCursor(input, text){
    var start = input.selectionStart, end = input.selectionEnd;
    if(start == null || end == null){ input.value += text; return; }
    var val = input.value;
    input.value = val.slice(0, start) + text + val.slice(end);
    var pos = start + text.length;
    input.setSelectionRange(pos, pos);
    input.focus();
  }

  function frQuestionLabel(q){
    if(q.dir === "dictado") return "Escucha y escribe";
    if(q.dir === "fr2es") return "¿Qué significa?";
    if(q.dir === "articulo") return "Escribe la palabra con su artículo";
    return "Escribe en francés";
  }

  function renderFrancesQuestion(){
    var q = state.current;
    state.answered = false;
    var timed = (state.mode === "contrarreloj");
    var isDictado = (q.dir === "dictado");
    var ttsOk = ("speechSynthesis" in window);
    var html = '';
    if(timed) html += '<div class="timerbar" id="timerBar"><i id="timerFill"></i></div>';

    var subLabel = (state.mode === "repaso") ? "Repasando un fallo"
      : (state.mode === "examen") ? ("Pregunta "+(state.examIndex+1)+"/"+state.examQuestions.length+" · "+frQuestionLabel(q))
      : frQuestionLabel(q);

    html += '<div class="question-wrap">'
      + '<p class="question-sub">'+subLabel+'</p>';
    if(isDictado){
      if(ttsOk){
        html += '<button type="button" class="speaker-btn big" id="playDictadoBtn" aria-label="Escuchar la palabra">🔊</button>';
      }else{
        html += '<div class="fr-prompt">'+escapeHTML(q.item.fr)+'</div>'
          + '<p class="hint" style="margin-top:4px">(Tu dispositivo no puede leerlo en voz alta ahora, pero puedes copiarla)</p>';
      }
    }else{
      html += '<div class="fr-prompt">'+escapeHTML(q.prompt)+'</div>'
        + (q.dir === "fr2es" && ttsOk ? '<button type="button" class="speaker-btn small" id="playPromptBtn" aria-label="Escuchar">🔊</button>' : '');
    }
    html += '</div>'
      + '<input class="frances-input" id="fracesInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="'+(q.dir==="fr2es" ? "Escribe el significado" : "Escribe la palabra en francés")+'">'
      + (q.dir !== "fr2es" ? '<div class="accent-row" id="accentRow">' + ACCENT_CHARS.map(function(c){ return '<button type="button" class="accent-btn" data-ch="'+c+'">'+c+'</button>'; }).join('') + '</div>' : '')
      + '<button class="primary-btn" id="checkFrancesBtn">Comprobar ✓</button>'
      + '<p class="feedback" id="feedback"></p>';
    els.gameCard.innerHTML = html;
    if(timed){
      els.timerBar = document.getElementById("timerBar");
      els.timerFill = document.getElementById("timerFill");
    }
    var playDictadoBtn = document.getElementById("playDictadoBtn");
    if(playDictadoBtn) playDictadoBtn.addEventListener("click", function(){ speakFrench(q.item.fr); });
    var playPromptBtn = document.getElementById("playPromptBtn");
    if(playPromptBtn) playPromptBtn.addEventListener("click", function(){ speakFrench(q.item.fr); });

    var input = document.getElementById("fracesInput");
    input.focus();
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); checkFrancesAnswer(); }
    });
    document.getElementById("checkFrancesBtn").addEventListener("click", checkFrancesAnswer);
    var accentRow = document.getElementById("accentRow");
    if(accentRow){
      accentRow.addEventListener("click", function(e){
        var btn = e.target.closest(".accent-btn");
        if(!btn) return;
        insertAtCursor(input, btn.getAttribute("data-ch"));
      });
    }
  }

  /* ---------------- Aprender (francés) ----------------
     Tarjetas sin preguntar nada: se ve la palabra en francés (ya con su
     artículo), su significado y se puede escuchar, para estudiarlas antes
     de que el resto de modos empiece a examinar de verdad. */
  function startAprender(){
    var pool = francesPool();
    if(!pool.length) pool = FRANCES_DATA;
    state.aprenderDeck = pool.slice().sort(function(){ return Math.random() - 0.5; });
    state.aprenderIndex = 0;
    renderAprenderCard();
  }
  function renderAprenderCard(){
    var deck = state.aprenderDeck;
    if(!deck.length){ startAprender(); return; }
    var item = deck[state.aprenderIndex];
    var ttsOk = ("speechSynthesis" in window);
    var isLast = state.aprenderIndex === deck.length - 1;
    var html = '<div class="question-wrap">'
      + '<p class="question-sub">Aprender</p>'
      + '<div class="fr-prompt">'+escapeHTML(item.fr)+'</div>'
      + (ttsOk ? '<button type="button" class="speaker-btn small" id="playAprenderBtn" aria-label="Escuchar">🔊</button>' : '')
      + '<p class="fr-meaning">'+escapeHTML(item.es[0])+'</p>'
      + '<p class="aprender-count">'+(state.aprenderIndex+1)+' de '+deck.length+'</p>'
      + '</div>'
      + '<button class="primary-btn" id="aprenderNextBtn">'+(isLast ? 'Empezar otra vuelta ⟲' : 'Siguiente ⟶')+'</button>'
      + '<button class="ghost-btn" id="aprenderPrevBtn" style="margin-top:8px"'+(state.aprenderIndex===0 ? ' disabled' : '')+'>⟵ Anterior</button>';
    els.gameCard.innerHTML = html;
    var playBtn = document.getElementById("playAprenderBtn");
    if(playBtn) playBtn.addEventListener("click", function(){ speakFrench(item.fr); });
    document.getElementById("aprenderNextBtn").addEventListener("click", function(){
      if(isLast){ startAprender(); return; }
      state.aprenderIndex++;
      renderAprenderCard();
    });
    var prevBtn = document.getElementById("aprenderPrevBtn");
    prevBtn.addEventListener("click", function(){
      if(state.aprenderIndex === 0) return;
      state.aprenderIndex--;
      renderAprenderCard();
    });
  }

  function checkFrancesAnswer(){
    if(state.answered) return;
    var input = document.getElementById("fracesInput");
    if(!input) return;
    var raw = input.value;
    if(raw.trim() === "") { input.focus(); return; }
    state.answered = true;
    var q = state.current;
    var ok = (q.dir === "fr2es")
      ? q.item.es.some(function(acc){ return normalizeEs(raw) === normalizeEs(acc); })
      : normalizeFr(raw) === normalizeFr(q.item.fr);

    input.disabled = true;
    input.classList.add(ok ? "correct" : "wrong");
    document.getElementById("checkFrancesBtn").disabled = true;
    Array.prototype.forEach.call(document.querySelectorAll(".accent-btn"), function(b){ b.disabled = true; });
    showResultMark(ok);

    var stats = regFrances(q.item.fr);
    stats.total++;
    if(ok) stats.correct++;
    saveJSON(PROGRESO_FR_KEY, progresoFrances);
    if(state.mode === "examen" && ok) state.examScore++;

    var fb = document.getElementById("feedback");
    if(ok){
      state.streak++;
      if(state.streak > 0 && state.streak % 5 === 0) state.stars++;
      if(state.roundActive) state.roundScore++;
      fb.textContent = pick(["¡Genial!","¡Eso es!","¡Muy bien!","¡Perfecto!","¡Sigue así!"]);
      fb.className = "feedback good";
      removeFromFallosFrances(q.item.fr);
    }else{
      state.streak = 0;
      var correcta = (q.dir === "fr2es") ? q.item.es[0] : q.item.fr;
      fb.textContent = "Era: " + correcta + ". ¡A por la siguiente!";
      fb.className = "feedback bad";
      addToFallosFrances(q.item.fr);
    }
    // Para "articulo"/"es2fr" (donde la palabra en francés no se ha visto
    // escrita en pantalla, solo tecleada) se ofrece oírla al revisar.
    if((q.dir === "articulo" || q.dir === "es2fr") && ("speechSynthesis" in window)){
      var listenBtn = document.createElement("button");
      listenBtn.type = "button";
      listenBtn.className = "speaker-btn small";
      listenBtn.setAttribute("aria-label","Escuchar");
      listenBtn.textContent = "🔊";
      listenBtn.addEventListener("click", function(){ speakFrench(q.item.fr); });
      fb.appendChild(document.createElement("br"));
      fb.appendChild(listenBtn);
    }
    els.streakVal.textContent = state.streak;
    els.starsVal.textContent = state.stars;
    renderFrancesMasteryStrip();

    var delay = ok ? 900 : 2400; // un poco más de tiempo para leer bien la palabra escrita
    setTimeout(function(){
      if(state.mode === "examen"){
        advanceExam();
        return;
      }
      if(state.roundActive || state.mode !== "contrarreloj"){
        next();
      }
    }, delay);
  }

  function addToFallosFrances(frWord){
    var entry = fallosFrances.filter(function(f){ return f.fr === frWord; })[0];
    if(entry){
      entry.count = (entry.count || 1) + 1;
      entry.lastWrong = Date.now();
    }else{
      fallosFrances.push({fr:frWord, count:1, lastWrong:Date.now()});
    }
    saveJSON(FALLOS_FR_KEY, fallosFrances);
  }
  function removeFromFallosFrances(frWord){
    var next = fallosFrances.filter(function(f){ return f.fr !== frWord; });
    if(next.length !== fallosFrances.length){
      fallosFrances = next;
      saveJSON(FALLOS_FR_KEY, fallosFrances);
    }
  }
  // Repaso ponderado: las palabras falladas más veces salen más a menudo
  // (tope de 5 para que una muy fallada no acapare todo el repaso).
  function pickWeightedFallo(){
    var pool = [];
    fallosFrances.forEach(function(f){
      var weight = Math.min(f.count || 1, 5);
      for(var i=0;i<weight;i++) pool.push(f.fr);
    });
    return pick(pool);
  }
  function nextFrancesRepaso(){
    if(fallosFrances.length === 0){
      els.gameCard.innerHTML = '<div class="empty-state">'
        + '<span class="num">🎉</span>'
        + '<p>¡No hay fallos pendientes! Sigue practicando el vocabulario y lo que falles aparecerá aquí para repasarlo.</p>'
        + '<button class="primary-btn" id="goPracticaFr">Ir a práctica</button>'
        + '</div>';
      document.getElementById("goPracticaFr").addEventListener("click", function(){ setMode("practica"); });
      return;
    }
    var frWord = pickWeightedFallo();
    var item = null;
    for(var i=0;i<FRANCES_DATA.length;i++){ if(FRANCES_DATA[i].fr === frWord){ item = FRANCES_DATA[i]; break; } }
    if(!item){ removeFromFallosFrances(frWord); nextFrancesRepaso(); return; }
    state.current = buildFrancesQuestion(item);
    renderFrancesQuestion();
  }

  function renderFrancesContrarrelojIntro(){
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">⏱️</span>'
      + '<p>60 segundos de vocabulario de francés.<br>Tu récord: <b>'+mejorContrarrelojFrances+'</b></p>'
      + '<button class="primary-btn" id="startRoundBtn">Empezar</button>'
      + '</div>';
    document.getElementById("startRoundBtn").addEventListener("click", function(){ startRound(60); });
  }
  function endFrancesContrarrelojRound(){
    if(state.roundScore > mejorContrarrelojFrances){
      mejorContrarrelojFrances = state.roundScore;
      saveJSON(BEST_FR_KEY, mejorContrarrelojFrances);
    }
    var esRecord = state.roundScore === mejorContrarrelojFrances && state.roundScore > 0;
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">'+state.roundScore+'</span>'
      + '<p>'+(esRecord ? "¡Nuevo récord! 🏆" : "Aciertos en 60 segundos")+'</p>'
      + '<p>Tu mejor marca: '+mejorContrarrelojFrances+'</p>'
      + '<button class="primary-btn" id="retryRoundBtn">Otra vez</button>'
      + '</div>';
    document.getElementById("retryRoundBtn").addEventListener("click", function(){ startRound(60); });
    updateHint();
  }

  /* ---------------- Examen de francés ----------------
     Ronda de longitud fija, sin pistas ni segundo intento, para practicar
     en condiciones parecidas a como se lo van a preguntar de verdad. No
     usa el motor de startRound()/endRound() (que es para rondas a tiempo)
     sino un índice propio que avanza pregunta a pregunta. */
  function examPoolSize(){
    var pool = francesPool();
    if(!pool.length) pool = FRANCES_DATA;
    return Math.min(EXAM_LENGTH, pool.length);
  }
  function renderExamIntro(){
    var n = examPoolSize();
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">📝</span>'
      + '<p>Examen de '+n+' preguntas sobre las categorías elegidas arriba. Sin pistas ni segundo intento, como en clase.</p>'
      + '<button class="primary-btn" id="startExamBtn">Empezar examen</button>'
      + '</div>';
    document.getElementById("startExamBtn").addEventListener("click", startExam);
  }
  function startExam(){
    var pool = francesPool();
    if(!pool.length) pool = FRANCES_DATA;
    var n = Math.min(EXAM_LENGTH, pool.length);
    var shuffled = pool.slice().sort(function(){ return Math.random() - 0.5; });
    state.examQuestions = [];
    for(var i=0;i<n;i++){
      state.examQuestions.push(buildFrancesQuestion(shuffled[i]));
    }
    state.examIndex = 0;
    state.examScore = 0;
    renderExamQuestion();
  }
  function renderExamQuestion(){
    state.current = state.examQuestions[state.examIndex];
    renderFrancesQuestion();
  }
  function advanceExam(){
    state.examIndex++;
    if(state.examIndex >= state.examQuestions.length){
      endExam();
    }else{
      renderExamQuestion();
    }
  }
  function endExam(){
    var total = state.examQuestions.length;
    var pct = total ? Math.round((state.examScore/total)*100) : 0;
    var msg = pct >= 90 ? "¡Sobresaliente! 🏆" : pct >= 70 ? "¡Muy bien! 🎉" : pct >= 50 ? "Vas bien, sigue practicando" : "Repasa un poco más y lo vuelves a intentar";
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">'+state.examScore+'/'+total+'</span>'
      + '<p>'+msg+' ('+pct+'%)</p>'
      + '<button class="primary-btn" id="retryExamBtn">Hacer otro examen</button>'
      + '</div>';
    document.getElementById("retryExamBtn").addEventListener("click", startExam);
    updateHint();
  }

  /* ---------------- Arranque (con soporte para republicaciones en caliente) ---------------- */
  function start(saved){
    var validSubject = false;
    if(saved && typeof saved === "object"){
      if(Array.isArray(saved.selectedTables) && saved.selectedTables.length) state.selectedTables = saved.selectedTables;
      if(typeof saved.streak === "number") state.streak = saved.streak;
      if(typeof saved.stars === "number") state.stars = saved.stars;
      if(typeof saved.mode === "string") state.mode = saved.mode;
      if(Array.isArray(saved.francesCategories) && saved.francesCategories.length){
        var validCats = FR_CATS.map(function(c){ return c.id; });
        var filteredCats = saved.francesCategories.filter(function(c){ return validCats.indexOf(c) !== -1; });
        if(filteredCats.length) state.francesCategories = filteredCats;
      }
      validSubject = SUBJECTS.some(function(s){ return s.id === saved.subject; });
    }
    renderTablesPicker();
    renderMasteryStrip();
    renderSubjectMenu();
    els.streakVal.textContent = state.streak;
    els.starsVal.textContent = state.stars;

    if(saved && saved.view === "subject" && validSubject){
      enterSubject(saved.subject);
      setMode(state.mode);
    }else{
      showMenu();
    }

    try{
      if(window.claude && window.claude.hot && window.claude.hot.snapshot){
        window.claude.hot.snapshot(function(){
          var restoreMode = (state.mode === "contrarreloj" || state.mode === "torneo" || state.mode === "examen") ? "practica" : state.mode;
          var inSubject = !els.subjectView.hidden;
          return {
            selectedTables: state.selectedTables,
            streak: state.streak,
            stars: state.stars,
            mode: restoreMode,
            subject: state.subject,
            view: inSubject ? "subject" : "menu",
            francesCategories: state.francesCategories
          };
        });
      }
    }catch(e){ /* no pasa nada si no está disponible */ }
  }

  try{
    if(window.claude && window.claude.hot && window.claude.hot.ready){
      window.claude.hot.ready(function(data){ start(data || {}); });
    }else{
      start({});
    }
  }catch(e){
    start({});
  }
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){ /* sin red la primera vez: no pasa nada */ });
  });
}
</script>
