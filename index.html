  /* ---------------- Aprender (francés) ----------------
     Tarjetas sin preguntar nada: se ve la palabra en francés (ya con su
     artículo), su significado y se puede escuchar, para estudiarlas antes
     de que el resto de modos empiece a examinar de verdad. */
  function startAprender(){
    var pool = francesPool();
    if(!pool.length) pool = FRANCES_DATA;
    state.aprenderDeck = pool.slice().sort(function(){ return Math.random() - 0.5; });
    state.aprenderIndex = 0;
    renderAprenderCard();
  }
  function renderAprenderCard(){
    var deck = state.aprenderDeck;
    if(!deck.length){ startAprender(); return; }
    var item = deck[state.aprenderIndex];
    var ttsOk = ("speechSynthesis" in window);
    var isLast = state.aprenderIndex === deck.length - 1;
    var html = '<div class="question-wrap">'
      + '<p class="question-sub">Aprender</p>'
      + '<div class="fr-prompt">'+escapeHTML(item.fr)+'</div>'
      + (ttsOk ? '<button type="button" class="speaker-btn small" id="playAprenderBtn" aria-label="Escuchar">🔊</button>' : '')
      + '<p class="fr-meaning">'+escapeHTML(item.es[0])+'</p>'
      + '<p class="aprender-count">'+(state.aprenderIndex+1)+' de '+deck.length+'</p>'
      + '</div>'
      + '<button class="primary-btn" id="aprenderNextBtn">'+(isLast ? 'Empezar otra vuelta ⟲' : 'Siguiente ⟶')+'</button>'
      + '<button class="ghost-btn" id="aprenderPrevBtn" style="margin-top:8px"'+(state.aprenderIndex===0 ? ' disabled' : '')+'>⟵ Anterior</button>';
    els.gameCard.innerHTML = html;
    var playBtn = document.getElementById("playAprenderBtn");
    if(playBtn) playBtn.addEventListener("click", function(){ speakFrench(item.fr); });
    document.getElementById("aprenderNextBtn").addEventListener("click", function(){
      if(isLast){ startAprender(); return; }
      state.aprenderIndex++;
      renderAprenderCard();
    });
    var prevBtn = document.getElementById("aprenderPrevBtn");
    prevBtn.addEventListener("click", function(){
      if(state.aprenderIndex === 0) return;
      state.aprenderIndex--;
      renderAprenderCard();
    });
  }

  function checkFrancesAnswer(){
    if(state.answered) return;
    var input = document.getElementById("fracesInput");
    if(!input) return;
    var raw = input.value;
    if(raw.trim() === "") { input.focus(); return; }
    state.answered = true;
    var q = state.current;
    var ok = (q.dir === "fr2es")
      ? q.item.es.some(function(acc){ return normalizeEs(raw) === normalizeEs(acc); })
      : normalizeFr(raw) === normalizeFr(q.item.fr);

    input.disabled = true;
    input.classList.add(ok ? "correct" : "wrong");
    document.getElementById("checkFrancesBtn").disabled = true;
    Array.prototype.forEach.call(document.querySelectorAll(".accent-btn"), function(b){ b.disabled = true; });
    showResultMark(ok);

    // La gramática (partitivo/conjugación/frase) no es una palabra de
    // FRANCES_DATA: no lleva mastery por tabla ni entra en "Fallos" (ese
    // repaso busca la palabra en FRANCES_DATA y no la encontraría), así
    // que esas dos cosas solo se tocan para preguntas de vocabulario.
    var esGramatica = (q.dir === "partitivo" || q.dir === "conjugacion" || q.dir === "frase");
    if(!esGramatica){
      var stats = regFrances(q.item.fr);
      stats.total++;
      if(ok) stats.correct++;
      saveJSON(PROGRESO_FR_KEY, progresoFrances);
    }
    if(state.mode === "examen"){
      if(ok) state.examScore++;
      // Para el resumen final: cuántos aciertos/fallos ha habido en cada
      // categoría de vocabulario, y la gramática aparte como su propio bloque.
      var examCat = esGramatica ? "gramatica" : q.item.cat;
      var ecs = state.examCatStats[examCat] || (state.examCatStats[examCat] = {correct:0,total:0});
      ecs.total++;
      if(ok) ecs.correct++;
    }

    var fb = document.getElementById("feedback");
    if(ok){
      state.streak++;
      if(state.streak > 0 && state.streak % 5 === 0) state.stars++;
      if(state.roundActive) state.roundScore++;
      fb.textContent = pick(["¡Genial!","¡Eso es!","¡Muy bien!","¡Perfecto!","¡Sigue así!"]);
      fb.className = "feedback good";
      if(!esGramatica) removeFromFallosFrances(q.item.fr);
    }else{
      state.streak = 0;
      var correcta = (q.dir === "fr2es") ? q.item.es[0] : q.item.fr;
      fb.textContent = "Era: " + correcta + ". ¡A por la siguiente!";
      fb.className = "feedback bad";
      if(!esGramatica) addToFallosFrances(q.item.fr);
    }
    // Para "articulo"/"es2fr" (donde la palabra en francés no se ha visto
    // escrita en pantalla, solo tecleada) se ofrece oírla al revisar.
    if((q.dir === "articulo" || q.dir === "es2fr" || q.dir === "partitivo" || q.dir === "conjugacion" || q.dir === "frase") && ("speechSynthesis" in window)){
      var listenBtn = document.createElement("button");
      listenBtn.type = "button";
      listenBtn.className = "speaker-btn small";
      listenBtn.setAttribute("aria-label","Escuchar");
      listenBtn.textContent = "🔊";
      listenBtn.addEventListener("click", function(){ speakFrench(q.item.fr); });
      fb.appendChild(document.createElement("br"));
      fb.appendChild(listenBtn);
    }
    els.streakVal.textContent = state.streak;
    els.starsVal.textContent = state.stars;
    renderFrancesMasteryStrip();

    var advance = (state.mode === "examen") ? advanceExam : next;
    if(state.roundActive){
      // Contrarreloj: la ronda sigue a su ritmo pase lo que pase.
      setTimeout(function(){ advance(); }, ok ? 900 : 2400);
    }else if(ok){
      setTimeout(function(){ advance(); }, 900);
    }else{
      // Fallo en modo sin cronómetro (incluido el examen): esperamos a que
      // toque "Siguiente", para que le dé tiempo a ver en qué falló.
      appendNextButton(advance);
    }
  }

  function addToFallosFrances(frWord){
    var entry = fallosFrances.filter(function(f){ return f.fr === frWord; })[0];
    if(entry){
      entry.count = (entry.count || 1) + 1;
      entry.lastWrong = Date.now();
    }else{
      fallosFrances.push({fr:frWord, count:1, lastWrong:Date.now()});
    }
    saveJSON(FALLOS_FR_KEY, fallosFrances);
  }
  function removeFromFallosFrances(frWord){
    var next = fallosFrances.filter(function(f){ return f.fr !== frWord; });
    if(next.length !== fallosFrances.length){
      fallosFrances = next;
      saveJSON(FALLOS_FR_KEY, fallosFrances);
    }
  }
  // Repaso ponderado: las palabras falladas más veces salen más a menudo
  // (tope de 5 para que una muy fallada no acapare todo el repaso).
  function pickWeightedFallo(){
    var pool = [];
    fallosFrances.forEach(function(f){
      var weight = Math.min(f.count || 1, 5);
      for(var i=0;i<weight;i++) pool.push(f.fr);
    });
    return pick(pool);
  }
  function nextFrancesRepaso(){
    if(fallosFrances.length === 0){
      els.gameCard.innerHTML = '<div class="empty-state">'
        + '<span class="num">🎉</span>'
        + '<p>¡No hay fallos pendientes! Sigue practicando el vocabulario y lo que falles aparecerá aquí para repasarlo.</p>'
        + '<button class="primary-btn" id="goPracticaFr">Ir a práctica</button>'
        + '</div>';
      document.getElementById("goPracticaFr").addEventListener("click", function(){ setMode("practica"); });
      return;
    }
    var frWord = pickWeightedFallo();
    var item = null;
    for(var i=0;i<FRANCES_DATA.length;i++){ if(FRANCES_DATA[i].fr === frWord){ item = FRANCES_DATA[i]; break; } }
    if(!item){ removeFromFallosFrances(frWord); nextFrancesRepaso(); return; }
    state.current = buildFrancesQuestion(item);
    renderFrancesQuestion();
  }

  function renderFrancesContrarrelojIntro(){
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">⏱️</span>'
      + '<p>60 segundos de vocabulario de francés.<br>Tu récord: <b>'+mejorContrarrelojFrances+'</b></p>'
      + '<button class="primary-btn" id="startRoundBtn">Empezar</button>'
      + '</div>';
    document.getElementById("startRoundBtn").addEventListener("click", function(){ startRound(60); });
  }
  function endFrancesContrarrelojRound(){
    if(state.roundScore > mejorContrarrelojFrances){
      mejorContrarrelojFrances = state.roundScore;
      saveJSON(BEST_FR_KEY, mejorContrarrelojFrances);
    }

    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">'+state.roundScore+'</span>'
      + '<p>'+(esRecord ? "¡Nuevo récord! 🏆" : "Aciertos en 60 segundos")+'</p>'
      + '<p>Tu mejor marca: '+mejorContrarrelojFrances+'</p>'
      + '<button class="primary-btn" id="retryRoundBtn">Otra vez</button>'
      + '</div>';
    document.getElementById("retryRoundBtn").addEventListener("click", function(){ startRound(60); });
    updateHint();
  }

  /* ---------------- Examen de francés ----------------
     Ronda de longitud fija, sin pistas ni segundo intento, para practicar
     en condiciones parecidas a como se lo van a preguntar de verdad. No
     usa el motor de startRound()/endRound() (que es para rondas a tiempo)
     sino un índice propio que avanza pregunta a pregunta. */
  // Si la categoría Comida está activa, el examen reserva un puñado de
  // preguntas para la gramática de Unité 3 (artículos partitivos) y el
  // resto son vocabulario, igual que en el libro se mezclan los dos.
  // (Los ejercicios de conjugar verbos ya no entran: todavía no los ha
  // dado en clase.)
  function examGramCount(){
    return (state.francesCategories.indexOf("comida") !== -1) ? Math.min(5, EXAM_LENGTH) : 0;
  }
  function examPoolSize(){
    var pool = francesPool();
    if(!pool.length) pool = FRANCES_DATA;
    var gramCount = examGramCount();
    var vocabCount = Math.min(EXAM_LENGTH - gramCount, pool.length);
    return vocabCount + gramCount;
  }
  function renderExamIntro(){
    var n = examPoolSize();
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">📝</span>'
      + '<p>Examen de '+n+' preguntas sobre las categorías elegidas arriba. Sin pistas ni segundo intento, como en clase.</p>'
      + '<button class="primary-btn" id="startExamBtn">Empezar examen</button>'
      + '</div>';
    document.getElementById("startExamBtn").addEventListener("click", startExam);
  }
  /* ---------------- Resumen de examen por categorías ----------------
     Común a francés y matemáticas: usa los aciertos/fallos que se han
     ido guardando por categoría durante el examen (state.examCatStats)
     para pintar una fila por categoría y destacar la más floja, así se
     ve de un vistazo qué repasar más antes del examen de verdad. */
  function examBreakdownHTML(catDefs){
    var rows = catDefs.map(function(c){
      return { label: c.label, stat: state.examCatStats[c.id] || {correct:0,total:0} };
    }).filter(function(r){ return r.stat.total > 0; });
    if(rows.length < 1) return "";
    rows.sort(function(a,b){
      return (a.stat.correct/a.stat.total) - (b.stat.correct/b.stat.total);
    });
    var rowsHTML = rows.map(function(r){
      var pct = Math.round((r.stat.correct/r.stat.total)*100);
      var cls = "m-low";
      if(pct >= 80) cls = "m-high"; else if(pct >= 40) cls = "m-mid";
      return '<div class="exam-cat-row">'
        + '<span class="exam-cat-name">'+escapeHTML(r.label)+'</span>'
        + '<span class="exam-cat-score">'+r.stat.correct+'/'+r.stat.total+'</span>'
        + '<span class="exam-cat-pct '+cls+'">'+pct+'%</span>'
        + '</div>';
    }).join('');
    var peor = rows[0];
    var peorPct = Math.round((peor.stat.correct/peor.stat.total)*100);
    var aviso = "";
    if(rows.length > 1){
      aviso = (peorPct < 100)
        ? '<p class="exam-study-more">📚 Repasa más: '+escapeHTML(peor.label)+' ('+peorPct+'%)</p>'
        : '<p class="hint">¡Todo al 100%! 🎉</p>';
    }
    return '<div class="exam-breakdown">'+rowsHTML+'</div>'+aviso;
  }

  function startExam(){
    var pool = francesPool();
    if(!pool.length) pool = FRANCES_DATA;
    var gramCount = examGramCount();
    var vocabCount = Math.min(EXAM_LENGTH - gramCount, pool.length);
    var shuffled = pool.slice().sort(function(){ return Math.random() - 0.5; });
    var qs = [];
    for(var i=0;i<vocabCount;i++){
      qs.push(buildFrancesQuestion(shuffled[i]));
    }
    for(var g=0; g<gramCount; g++){
      qs.push(buildPartitivoQuestion());
    }
    state.examQuestions = qs.sort(function(){ return Math.random() - 0.5; });
    state.examIndex = 0;
    state.examScore = 0;
    state.examCatStats = {};
    renderExamQuestion();
  }
  function renderExamQuestion(){
    state.current = state.examQuestions[state.examIndex];
    renderFrancesQuestion();
  }
  function advanceExam(){
    state.examIndex++;
    if(state.examIndex >= state.examQuestions.length){
      endExam();
    }else{
      renderExamQuestion();
    }
  }
  function endExam(){
    var total = state.examQuestions.length;
    var pct = total ? Math.round((state.examScore/total)*100) : 0;
    var fallos = total - state.examScore;
    var msg = pct >= 90 ? "¡Sobresaliente! 🏆" : pct >= 70 ? "¡Muy bien! 🎉" : pct >= 50 ? "Vas bien, sigue practicando" : "Repasa un poco más y lo vuelves a intentar";
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">'+pct+'%</span>'
      + '<p>'+state.examScore+' aciertos y '+fallos+' fallos de '+total+'</p>'
      + '<p>'+msg+'</p>'
      + examBreakdownHTML(FR_EXAM_CATS)
      + '<button class="primary-btn" id="retryExamBtn">Hacer otro examen</button>'
      + '</div>';
    document.getElementById("retryExamBtn").addEventListener("click", startExam);
    updateHint();
  }

  /* ---------------- Matemáticas: números grandes, aproximación, ordinales, romanos y problemas ----------------
     Mismo patrón que francés (pregunta con input de texto libre), pero
     aquí no hay un banco fijo de "palabras": cada pregunta se genera al
     vuelo y ya trae calculada su respuesta correcta (ver generateMatesPregunta
     más arriba), así que los Fallos guardan una foto completa de la
     pregunta fallada en vez de buscarla por nombre. */
  function matQuestionLabel(q){
    if(q.dir === "leer" || q.dir === "cifras_a_letras") return "Escribe cómo se lee";
    if(q.dir === "componer") return "¿Qué número es?";
    if(q.dir === "descomponer") return "Responde con cifras";
    if(q.dir === "comparar") return "Escribe <, > o =";
    if(q.dir === "aproximar") return "Escribe el número aproximado";
    if(q.dir === "letras_a_cifras") return "Escribe el número con cifras";
    if(q.dir === "arabigo_a_romano") return "Escribe el número romano";
    if(q.dir === "romano_a_arabigo") return "Escribe el número en cifras";
    if(q.dir === "problema") return "Resuelve el problema";
    return "Escribe la respuesta";
  }
  function matPlaceholder(q){
    if(q.dir === "comparar") return "< , > o =";
    if(q.dir === "arabigo_a_romano") return "Ej: XIV";
    if(q.dir === "leer" || q.dir === "cifras_a_letras") return "Escribe en letras";
    return "Escribe la respuesta";
  }
  function renderMatesQuestion(){
    var q = state.current;
    state.answered = false;
    var timed = (state.mode === "contrarreloj");
    var html = '';
    if(timed) html += '<div class="timerbar" id="timerBar"><i id="timerFill"></i></div>';
    var subLabel = (state.mode === "repaso") ? "Repasando un fallo"
      : (state.mode === "examen") ? ("Pregunta "+(state.examIndex+1)+"/"+state.examQuestions.length+" · "+matQuestionLabel(q))
      : matQuestionLabel(q);
    var promptClass = (q.dir === "problema") ? "mat-problema" : "fr-prompt";
    html += '<div class="question-wrap">'
      + '<p class="question-sub">'+subLabel+'</p>'
      + '<div class="'+promptClass+'">'+escapeHTML(q.prompt)+'</div>'
      + '</div>'
      + '<input class="frances-input" id="matesInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="'+matPlaceholder(q)+'">'
      + '<button class="primary-btn" id="checkMatesBtn">Comprobar ✓</button>'
      + '<p class="feedback" id="feedback"></p>';
    els.gameCard.innerHTML = html;
    if(timed){
      els.timerBar = document.getElementById("timerBar");
      els.timerFill = document.getElementById("timerFill");
    }
    var input = document.getElementById("matesInput");
    input.focus();
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); checkMatesAnswer(); }
    });
    document.getElementById("checkMatesBtn").addEventListener("click", checkMatesAnswer);
  }

  function matchesMatesAnswer(raw, q){
    if(q.checkType === "numero"){
      var digits = raw.replace(/[^0-9-]/g,"");
      var val = parseInt(digits,10);
      return !isNaN(val) && val === q.correct;
    }
    if(q.checkType === "texto"){
      return normalizeEs(raw) === normalizeEs(q.correct);
    }
    if(q.checkType === "simbolo"){
      return raw.trim().charAt(0) === q.correct;
    }
    if(q.checkType === "romano"){
      return raw.toUpperCase().replace(/[^IVXLCDM]/g,"") === q.correct;
    }
    return false;
  }

  function checkMatesAnswer(){
    if(state.answered) return;
    var input = document.getElementById("matesInput");
    if(!input) return;
    var raw = input.value;
    if(raw.trim() === "") { input.focus(); return; }
    state.answered = true;
    var q = state.current;
    var ok = matchesMatesAnswer(raw, q);

    input.disabled = true;
    input.classList.add(ok ? "correct" : "wrong");
    document.getElementById("checkMatesBtn").disabled = true;
    showResultMark(ok);

    var stats = regMates(q.cat);
    stats.total++;
    if(ok) stats.correct++;
    saveJSON(PROGRESO_MATES_KEY, progresoMates);
    if(state.mode === "examen"){
      if(ok) state.examScore++;
      // Para el resumen final: aciertos/fallos por categoría (numeros,
      // aproximacion, ordinales, romanos, problemas).
      var ecs = state.examCatStats[q.cat] || (state.examCatStats[q.cat] = {correct:0,total:0});
      ecs.total++;
      if(ok) ecs.correct++;
    }

    var fb = document.getElementById("feedback");
    if(ok){
      state.streak++;
      if(state.streak > 0 && state.streak % 5 === 0) state.stars++;
      if(state.roundActive) state.roundScore++;
      fb.textContent = pick(["¡Genial!","¡Eso es!","¡Muy bien!","¡Perfecto!","¡Sigue así!"]);
      fb.className = "feedback good";
      removeFromFallosMates(q);
    }else{
      state.streak = 0;
      fb.textContent = "Era: " + q.correctDisplay + ". ¡A por la siguiente!";
      fb.className = "feedback bad";
      addToFallosMates(q);
    }
    els.streakVal.textContent = state.streak;
    els.starsVal.textContent = state.stars;
    renderMatesMasteryStrip();

    var advance = (state.mode === "examen") ? advanceMatesExam : next;
    if(state.roundActive){
      setTimeout(function(){ advance(); }, ok ? 900 : 2400);
    }else if(ok){
      setTimeout(function(){ advance(); }, 900);
    }else{
      appendNextButton(advance);
    }
  }

  function matesFalloKey(q){ return q.cat+"|"+q.dir+"|"+q.prompt; }
  function addToFallosMates(q){
    var key = matesFalloKey(q);
    var entry = fallosMates.filter(function(f){ return matesFalloKey(f) === key; })[0];
    if(entry){
      entry.count = (entry.count || 1) + 1;
      entry.lastWrong = Date.now();
    }else{
      fallosMates.push({cat:q.cat, dir:q.dir, prompt:q.prompt, correct:q.correct, correctDisplay:q.correctDisplay, checkType:q.checkType, count:1, lastWrong:Date.now()});
    }
    saveJSON(FALLOS_MATES_KEY, fallosMates);
  }
  function removeFromFallosMates(q){
    var key = matesFalloKey(q);
    var next = fallosMates.filter(function(f){ return matesFalloKey(f) !== key; });
    if(next.length !== fallosMates.length){
      fallosMates = next;
      saveJSON(FALLOS_MATES_KEY, fallosMates);
    }
  }
  function pickWeightedFalloMates(){
    var pool = [];
    fallosMates.forEach(function(f){
      var weight = Math.min(f.count || 1, 5);
      for(var i=0;i<weight;i++) pool.push(f);
    });
    return pick(pool);
  }
  function nextMatesRepaso(){
    if(fallosMates.length === 0){
      els.gameCard.innerHTML = '<div class="empty-state">'
        + '<span class="num">🎉</span>'
        + '<p>¡No hay fallos pendientes! Sigue practicando y lo que falles aparecerá aquí para repasarlo.</p>'
        + '<button class="primary-btn" id="goPracticaMates">Ir a práctica</button>'
        + '</div>';
      document.getElementById("goPracticaMates").addEventListener("click", function(){ setMode("practica"); });
      return;
    }
    var f = pickWeightedFalloMates();
    state.current = { cat:f.cat, dir:f.dir, prompt:f.prompt, correct:f.correct, correctDisplay:f.correctDisplay, checkType:f.checkType };
    renderMatesQuestion();
  }

  function renderMatesContrarrelojIntro(){
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">⏱️</span>'
      + '<p>60 segundos de matemáticas.<br>Tu récord: <b>'+mejorContrarrelojMates+'</b></p>'
      + '<button class="primary-btn" id="startRoundBtn">Empezar</button>'
      + '</div>';
    document.getElementById("startRoundBtn").addEventListener("click", function(){ startRound(60); });
  }
  function endMatesContrarrelojRound(){
    if(state.roundScore > mejorContrarrelojMates){
      mejorContrarrelojMates = state.roundScore;
      saveJSON(BEST_MATES_KEY, mejorContrarrelojMates);
    }
    var esRecord = state.roundScore === mejorContrarrelojMates && state.roundScore > 0;
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">'+state.roundScore+'</span>'
      + '<p>'+(esRecord ? "¡Nuevo récord! 🏆" : "Aciertos en 60 segundos")+'</p>'
      + '<p>Tu mejor marca: '+mejorContrarrelojMates+'</p>'
      + '<button class="primary-btn" id="retryRoundBtn">Otra vez</button>'
      + '</div>';
    document.getElementById("retryRoundBtn").addEventListener("click", function(){ startRound(60); });
    updateHint();
  }

  /* ---------------- Examen de matemáticas ----------------
     Longitud fija (EXAM_LENGTH) repartida a partes iguales entre las
     categorías activas, sin depender de un banco limitado de palabras
     porque todo se genera al vuelo. */
  function renderMatesExamIntro(){
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">📝</span>'
      + '<p>Examen de '+EXAM_LENGTH+' preguntas repartidas entre las categorías elegidas arriba. Sin pistas ni segundo intento, como en clase.</p>'
      + '<button class="primary-btn" id="startExamBtn">Empezar examen</button>'
      + '</div>';
    document.getElementById("startExamBtn").addEventListener("click", startMatesExam);
  }
  function buildMatesQuestionFor(cat){
    if(cat === "numeros") return buildNumerosQuestion();
    if(cat === "aproximacion") return buildAproximacionQuestion();
    if(cat === "ordinales") return buildOrdinalQuestion();
    if(cat === "romanos") return buildRomanoQuestion();
    return buildProblemaQuestion();
  }
  function startMatesExam(){
    var cats = state.matesCategories.length ? state.matesCategories : MATES_CATS.map(function(c){ return c.id; });
    var qs = [];
    for(var i=0;i<EXAM_LENGTH;i++){
      qs.push(buildMatesQuestionFor(cats[i % cats.length]));
    }
    state.examQuestions = qs.sort(function(){ return Math.random() - 0.5; });
    state.examIndex = 0;
    state.examScore = 0;
    state.examCatStats = {};
    renderMatesExamQuestion();
  }
  function renderMatesExamQuestion(){
    state.current = state.examQuestions[state.examIndex];
    renderMatesQuestion();
  }
  function advanceMatesExam(){
    state.examIndex++;
    if(state.examIndex >= state.examQuestions.length){
      endMatesExam();
    }else{
      renderMatesExamQuestion();
    }
  }
  function endMatesExam(){
    var total = state.examQuestions.length;
    var pct = total ? Math.round((state.examScore/total)*100) : 0;
    var fallos = total - state.examScore;
    var msg = pct >= 90 ? "¡Sobresaliente! 🏆" : pct >= 70 ? "¡Muy bien! 🎉" : pct >= 50 ? "Vas bien, sigue practicando" : "Repasa un poco más y lo vuelves a intentar";
    els.gameCard.innerHTML = '<div class="summary">'
      + '<span class="num">'+pct+'%</span>'
      + '<p>'+state.examScore+' aciertos y '+fallos+' fallos de '+total+'</p>'
      + '<p>'+msg+'</p>'
      + examBreakdownHTML(MATES_CATS)
      + '<button class="primary-btn" id="retryExamBtn">Hacer otro examen</button>'
      + '</div>';
    document.getElementById("retryExamBtn").addEventListener("click", startMatesExam);
    updateHint();
  }

  /* ---------------- Arranque (con soporte para republicaciones en caliente) ---------------- */
  function start(saved){
    var validSubject = false;
    if(saved && typeof saved === "object"){
      if(Array.isArray(saved.selectedTables) && saved.selectedTables.length) state.selectedTables = saved.selectedTables;
      if(typeof saved.streak === "number") state.streak = saved.streak;
      if(typeof saved.stars === "number") state.stars = saved.stars;
      if(typeof saved.mode === "string") state.mode = saved.mode;
      if(Array.isArray(saved.francesCategories) && saved.francesCategories.length){
        var validCats = FR_CATS.map(function(c){ return c.id; });
        var filteredCats = saved.francesCategories.filter(function(c){ return validCats.indexOf(c) !== -1; });
        if(filteredCats.length) state.francesCategories = filteredCats;
      }
      if(Array.isArray(saved.matesCategories) && saved.matesCategories.length){
        var validMatCats = MATES_CATS.map(function(c){ return c.id; });
        var filteredMatCats = saved.matesCategories.filter(function(c){ return validMatCats.indexOf(c) !== -1; });
        if(filteredMatCats.length) state.matesCategories = filteredMatCats;
      }
      validSubject = SUBJECTS.some(function(s){ return s.id === saved.subject; });
    }
    renderTablesPicker();
    renderMasteryStrip();
    renderSubjectMenu();
    els.streakVal.textContent = state.streak;
    els.starsVal.textContent = state.stars;

    if(saved && saved.view === "subject" && validSubject){
      enterSubject(saved.subject);
      setMode(state.mode);
    }else{
      showMenu();
    }

    try{
      if(window.claude && window.claude.hot && window.claude.hot.snapshot){
        window.claude.hot.snapshot(function(){
          var restoreMode = (state.mode === "contrarreloj" || state.mode === "torneo" || state.mode === "examen") ? "practica" : state.mode;
          var inSubject = !els.subjectView.hidden;
          return {
            selectedTables: state.selectedTables,
            streak: state.streak,
            stars: state.stars,
            mode: restoreMode,
            subject: state.subject,
            view: inSubject ? "subject" : "menu",
            francesCategories: state.francesCategories,
            matesCategories: state.matesCategories
          };
        });
      }
    }catch(e){ /* no pasa nada si no está disponible */ }
  }

  try{
    if(window.claude && window.claude.hot && window.claude.hot.ready){
      window.claude.hot.ready(function(data){ start(data || {}); });
    }else{
      start({});
    }
  }catch(e){
    start({});
  }
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){ /* sin red la primera vez: no pasa nada */ });
  });
}
</script>
